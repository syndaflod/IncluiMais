    <link rel="stylesheet" href="css/site.css">
    <script src="js/accessibility-init.js"></script>

<body>
    <div class="accessibility-bar" data-accessibility-controls></div>
    <header class="site-header">
        <div class="nav-shell">
            <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">+</span>IncluiMais</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu-principal">Menu</button>
            <nav id="menu-principal" class="site-nav" aria-label="Menu principal">
                <a href="index.html">Início</a>

                <h1>Galeria</h1>
                <p>Imagens ligadas à acessibilidade e à comunidade do IncluiMais.</p>
