<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <title>Três cartões com os estados disponível, não disponível e não informado</title>
  <rect width="800" height="600" fill="#f6f8f2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">
    <rect x="110" y="80" width="580" height="120" rx="24" fill="#218838"/>
    <path d="M155 140l26 26 48-54" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="260" y="154" fill="#fff">Disponível</text>
    <rect x="110" y="240" width="580" height="120" rx="24" fill="#c62828"/>
    <path d="M160 275l50 50M210 275l-50 50" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
    <text x="260" y="314" fill="#fff">Não disponível</text>
    <rect x="110" y="400" width="580" height="120" rx="24" fill="#d0d3d6"/>
    <text x="168" y="482" fill="#202124" font-size="70">?</text>
    <text x="260" y="474" fill="#202124">Não informado</text>
  </g>
</svg>
