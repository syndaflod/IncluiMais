<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Entre em contato com a equipe do IncluiMais.">
    <title>Contato | IncluiMais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/site.css">
</head>

<body><a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="site-header">
        <div class="nav-shell"><a class="brand" href="index.html"><span class="brand-mark"
                    aria-hidden="true">+</span>IncluiMais</a><button class="nav-toggle" type="button"
                aria-expanded="false" aria-controls="menu-principal">Menu</button>
            <nav id="menu-principal" class="site-nav" aria-label="Menu principal"><a href="index.html">Início</a><a
                    href="mapa.html">Mapa</a><a href="acessibilidade.html">Acessibilidade</a><a
                    href="cadastro_estabelecimento.html">Cadastrar local</a><a href="contato.html"
                    aria-current="page">Contato</a></nav>
        </div>
    </header>
    <main id="conteudo" class="page-main">
        <header class="page-heading">
            <h1>Contato e sugestões</h1>
            <p>Encontrou um erro, quer sugerir uma melhoria ou falar sobre o projeto? Envie uma mensagem.</p>
        </header>
        <form class="form" data-demo-form>
            <div class="form-grid">
                <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text"
                        required autocomplete="name"></div>
                <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required
                        autocomplete="email"></div>
                <div class="field"><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel"
                        required autocomplete="tel" pattern="\(?[0-9]{2}\)?\s?[0-9]{4,5}-?[0-9]{4}"
                        aria-describedby="dica-telefone"><small id="dica-telefone">Exemplo: (11) 99999-9999.</small>
                </div>
                <div class="field"><label for="assunto">Assunto</label><select id="assunto" name="assunto" required>
                        <option value="">Selecione</option>
                        <option>Sugestão</option>
                        <option>Correção de informação</option>
                        <option>Dúvida</option>
                        <option>Parceria</option>
                    </select></div>
                <div class="field full"><label for="mensagem">Mensagem</label><textarea id="mensagem" name="mensagem"
                        required></textarea></div>
            </div>
            <p class="form-status" data-form-status role="status" aria-live="polite"></p><button class="button"
                type="submit">Enviar mensagem</button>
        </form>
    </main>
    <footer class="site-footer">
        <div class="footer-shell">
            <p><strong>IncluiMais</strong><br>Informação para uma cidade mais acessível.</p>
            <p><a href="sobre.html">Sobre o projeto</a></p>
        </div>
    </footer>
    <script src="js/site.js"></script>
</body>

</html>
