<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Cadastre um estabelecimento acessível no IncluiMais."><title>Cadastrar local | IncluiMais</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/site.css"></head><body><a class="skip-link" href="#conteudo">Pular para o conteúdo</a><header class="site-header"><div class="nav-shell"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">+</span>IncluiMais</a><button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu-principal">Menu</button><nav id="menu-principal" class="site-nav" aria-label="Menu principal"><a href="index.html">Início</a><a href="mapa.html">Mapa</a><a href="acessibilidade.html">Acessibilidade</a><a href="cadastro_estabelecimento.html" aria-current="page">Cadastrar local</a><a href="contato.html">Contato</a></nav></div></header><main id="conteudo" class="page-main"><header class="page-heading"><h1>Indique um estabelecimento</h1><p>Compartilhe informações que possam ajudar outra pessoa a planejar uma visita com mais autonomia.</p></header><form class="form" data-demo-form><div class="form-grid"><div class="field"><label for="nome-local">Nome do estabelecimento</label><input id="nome-local" name="nome-local" type="text" required autocomplete="organization"></div><div class="field"><label for="categoria">Categoria</label><select id="categoria" name="categoria" required><option value="">Selecione</option><option>Restaurante</option><option>Loja</option><option>Instituição de ensino</option><option>Farmácia</option><option>Espaço de lazer</option></select></div><div class="field"><label for="rua">Rua e número</label><input id="rua" name="rua" type="text" required autocomplete="street-address"></div><div class="field"><label for="cep">CEP</label><input id="cep" name="cep" type="text" required inputmode="numeric" pattern="[0-9]{5}-?[0-9]{3}" aria-describedby="dica-cep"><small id="dica-cep">Use o formato 00000-000.</small></div><div class="field full"><label>Recursos observados</label><div class="feature-list"><label><input type="checkbox" name="recursos" value="entrada"> Entrada acessível</label><label><input type="checkbox" name="recursos" value="banheiro"> Banheiro acessível</label><label><input type="checkbox" name="recursos" value="libras"> Atendimento em Libras</label><label><input type="checkbox" name="recursos" value="tatil"> Piso tátil</label></div></div><div class="field full"><label for="observacoes">Observações</label><textarea id="observacoes" name="observacoes" required placeholder="Descreva como você verificou essa informação."></textarea></div></div><p class="form-status" data-form-status role="status" aria-live="polite"></p><button class="button" type="submit">Enviar indicação</button></form></main><footer class="site-footer"><div class="footer-shell"><p><strong>IncluiMais</strong><br>Informação para uma cidade mais acessível.</p><p><a href="mapa.html">Ver o mapa</a></p></div></footer><script src="js/site.js"></script></body></html>
